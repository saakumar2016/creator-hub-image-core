# Checks every pull request to main and every push to main (no deploys here).
# This package is not deployed anywhere; the tools install it from a version tag.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test, lint, type-check, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node as local development and the Pages project.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm

      # npm ci runs the prepare script (tsc build), as a git dependency install does.
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Check the published files
        run: test -f dist/index.js && test -f dist/index.d.ts && test -f dist/pages/cli.js && test -f dist/png/index.js && test -f dist/png/index.d.ts && test -f dist/png/worker.js && ! grep -q './png/' dist/index.js
